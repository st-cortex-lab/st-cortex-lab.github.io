<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#00539b"/>
  <!-- scissors forming the St Andrew's saltire -->
  <g fill="#fff">
    <path d="M6 4 L34.4 25.6 L30.4 30.4 Z"/>
    <path d="M58 4 L29.6 25.6 L33.6 30.4 Z"/>
  </g>
  <g stroke="#fff" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M32 28 L23.6 36.4 M32 28 L40.4 36.4"/>
  </g>
  <circle cx="32" cy="28" r="2.3" fill="#00539b" stroke="#fff" stroke-width="1.3"/>
  <!-- dexterous robot hand: thumb and index through the rings, other fingers curled -->
  <g stroke="#6cace4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M41 56.5 L47 56 L49 52.5" stroke-width="4"/>
    <path d="M41 61.5 L46.5 61.5 L48.5 58.5" stroke-width="4"/>
    <path d="M26 51 L21 46.5 L20 40" stroke-width="5"/>
    <path d="M38 50.5 L43 46.5 L44 40" stroke-width="5"/>
  </g>
  <rect x="23" y="48" width="19" height="20" rx="4.5" fill="#6cace4"/>
  <g fill="#003e74">
    <circle cx="21" cy="46.5" r="1.2"/><circle cx="43" cy="46.5" r="1.2"/>
    <circle cx="47" cy="56" r="1"/><circle cx="46.5" cy="61.5" r="1"/>
    <circle cx="32.5" cy="57" r="3" fill="none" stroke="#003e74" stroke-width="1.2"/>
  </g>
  <!-- finger rings drawn last so the fingers pass through them -->
  <g stroke="#fff" stroke-width="3" fill="none">
    <circle cx="20" cy="40" r="5"/>
    <circle cx="44" cy="40" r="5"/>
  </g>
</svg>
