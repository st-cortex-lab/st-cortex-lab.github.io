- title: Deformable Object Manipulation
  text: >-
    Cloth, garments and other deformable objects have near-infinite configurations, self-occlusion
    and complex dynamics. We develop methods that let robots flatten, fold and shape them from
    crumpled states, as in PlaNet-ClothPick, JA-TN, DRAPER and LaGarNet.
- title: Tactile Manipulation
  text: >-
    Vision alone cannot tell a robot how hard it is gripping, whether a grasp is slipping or how
    many layers of fabric it is holding. We study how touch sensing can guide contact-rich
    manipulation and make grasping more reliable.
- title: Dexterous Manipulation
  text: >-
    We aim for robot hands and grippers that handle objects with human-like skill, from precise
    pick-and-place to in-hand manipulation, and that transfer from simulation to real hardware.
- title: Lifelong Robot Learning
  text: >-
    Robots in homes and workplaces meet new objects and tasks throughout their lives. We study how
    they can keep learning from experience and demonstrations without forgetting earlier skills.
- title: World Models
  text: >-
    We learn latent dynamics models of how the world responds to a robot's actions and plan inside
    them, so robots can predict the consequences of an action before taking it.
